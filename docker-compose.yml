version: '3.9'

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: zen-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: mindfulme
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - zen-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Express API Server ─────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zen-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/mindfulme
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - zen-network

  # ── React Frontend ─────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: zen-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - zen-network

# ── Persistent Volume ──────────────────────────────────────────────────────
volumes:
  mongo-data:
    driver: local

# ── Internal Network ───────────────────────────────────────────────────────
networks:
  zen-network:
    driver: bridge
